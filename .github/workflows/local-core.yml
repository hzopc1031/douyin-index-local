name: Local core portability
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  offline:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-core.txt
      - run: python -m unittest -v test_local_cli test_local_comments test_client test_local_startup test_app.DesktopImportTests
      - run: node test_local_ui.cjs
      - run: node test_home_ui.cjs
      - run: node test_comments_ui.cjs
      - run: node test_sms_ui.cjs
      - run: node test_date_ui.cjs
      - run: python -m unittest -v tests.test_file_lock
        working-directory: tools/douyin_comments
  mac-comments:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/douyin_comments/requirements.txt
      - run: python -m unittest -v tests.test_core tests.test_local_session
        working-directory: tools/douyin_comments
        env:
          TMPDIR: /private/tmp
  windows-comments-groundwork:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-core.txt -r tools/douyin_comments/requirements.txt
      - run: python -m unittest -v tests.test_windows_primitives tests.test_file_lock
        working-directory: tools/douyin_comments
  cross-origin-replay:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-core.txt -r tools/douyin_comments/requirements.txt
      - run: python -m playwright install chromium --only-shell
      - run: python -m unittest -v tests.test_cross_origin
        working-directory: tools/douyin_comments
        env:
          DYC_CORS_BROWSER_TESTS: '1'
