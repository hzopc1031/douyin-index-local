<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>抖音搜索指数 · 小批量核对</title>
<style>body{font:15px -apple-system,BlinkMacSystemFont,sans-serif;background:#f5f6f8;color:#20242c;margin:30px}h1{font-size:25px}h2{font-size:20px}p{line-height:1.7;color:#5b6371}.card{background:white;padding:24px;margin:20px 0;border-radius:14px;border:1px solid #e2e6eb}label{display:inline-block;vertical-align:top;margin:8px 20px 16px 0}input,textarea,select{font:inherit;padding:10px;border:1px solid #bbc3ce;border-radius:7px;display:block;margin-top:6px}textarea{width:230px;line-height:1.5;resize:vertical}input{width:190px}button{font:inherit;border:0;background:#245bd7;color:white;padding:11px 18px;border-radius:8px;margin:0 8px 6px 0;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#eaf0fc;color:#254b97}#status{white-space:pre-wrap;line-height:1.6}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:9px;border-bottom:1px solid #e5e8ed}td input{width:150px;margin:0;padding:6px}.ok{color:#137449}.error{color:#a42537}.hint{font-size:13px}#results{display:none}#quality{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#edf3fc;border-radius:6px;padding:8px 12px}#folder{overflow-wrap:anywhere}</style>
<h1>抖音搜索指数 · 小批量核对</h1><p>每批 1—5 个关键词，连续 7 天。相同批次的完整结果可在 24 小时内直接复用。</p>
<div class="card"><h2>抖音热榜</h2><p class="hint">手动获取一次公开热榜，无需登录；网络错误或限频时停止，不自动重试。</p><button id="hot-fetch" onclick="fetchHotlist()">获取热榜</button><p id="hot-status" role="status">尚未获取。</p><ol id="hot-items"></ol></div>
<div class="card"><button class="secondary" onclick="official()">显示官方登录与指数页面</button><p class="hint">在官方窗口登录并确认可用日期。登录会话仅保留在本次运行的内存中。</p>
<label>关键词，每行一个<textarea id="keywords" rows="5">酵素
消化酶
膳食补充剂
银杏
益生菌</textarea></label><label>官方页面的截止日期<input id="end" type="date"></label><p id="range" class="hint">请从页面确认可用截止日，工具自动向前取 7 天。</p><button id="fetch" onclick="fetchData()">获取或读取这批 7 天数据</button><div id="status">等待查询。</div></div>
<div id="results" class="card"><h2>批次结果</h2><div id="quality"></div><p id="provenance" class="hint"></p><label>查看关键词<select id="word"></select></label><p class="hint">输入官方图表提示中的完整搜索指数。切换关键词会保留已填值；保存时核对整个批次。</p><table><thead><tr><th>日期</th><th>程序搜索指数</th><th>页面显示值</th><th>核对结果</th></tr></thead><tbody id="rows"></tbody></table><p><button id="compare" onclick="compare()">保存整批核对结果</button></p><div id="comparison"></div><p class="hint" id="folder"></p></div>
<script>
const $=id=>document.getElementById(id);let currentRows=[],pageValues=new Map(),checks=new Map();const key=r=>JSON.stringify([r.keyword,r.date]);const labels={match:'一致',mismatch:'不一致',pending:'待核对',insufficient_precision:'精度不足',unreadable:'无法解析'};
async function fetchHotlist(){$('hot-fetch').disabled=true;$('hot-status').textContent='正在获取热榜……';$('hot-items').replaceChildren();try{const r=await pywebview.api.fetch_hotlist();if(!r.ok){$('hot-status').textContent=(r.message||'获取失败')+' 未自动重试。';return}$('hot-status').textContent='采集时间：'+r.data.fetched_at;for(const item of r.data.items){const li=document.createElement('li');li.textContent=`${item.position}. ${item.word} · 热度 ${item.hot_value===null?'—':item.hot_value}`;$('hot-items').append(li)}}catch(e){$('hot-status').textContent='本地窗口连接异常。'}finally{$('hot-fetch').disabled=false}}
$('end').addEventListener('change',()=>{const d=new Date($('end').value+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-6);$('range').textContent=Number.isNaN(d.valueOf())?'请选择日期':`区间：${d.toISOString().slice(0,10)} 至 ${$('end').value}，含首尾共 7 天。`});
async function official(){await pywebview.api.show_official_page()}
function renderRows(){const word=$('word').value;$('rows').replaceChildren();for(const row of currentRows.filter(x=>x.keyword===word)){const tr=document.createElement('tr');for(const v of [row.date,row.search_index===null?'缺失':String(row.search_index)]){const td=document.createElement('td');td.textContent=v;tr.append(td)}const td=document.createElement('td'),input=document.createElement('input');input.setAttribute('aria-label',row.keyword+' '+row.date+' 页面搜索指数');input.value=pageValues.get(key(row))||'';input.addEventListener('input',()=>pageValues.set(key(row),input.value));input.dataset.rowkey=key(row);td.append(input);tr.append(td);const result=document.createElement('td');result.textContent=labels[checks.get(key(row))||'pending'];tr.append(result);$('rows').append(tr)}}
function readVisible(){for(const input of $('rows').querySelectorAll('input'))pageValues.set(input.dataset.rowkey,input.value)}
$('word').addEventListener('change',()=>{readVisible();renderRows()});
async function fetchData(){if(!$('end').value){$('status').textContent='请先确认官方页面可用的截止日期。';return}$('fetch').disabled=true;$('compare').disabled=true;$('status').textContent='正在检查本地缓存并获取批次……';try{const r=await pywebview.api.fetch_batch($('keywords').value,$('end').value);if(!r.ok){$('status').className='error';$('status').textContent=`${r.code||'提示'}：${r.message}\n已停止，没有自动重试。`;return}currentRows=r.rows;pageValues=new Map();checks=new Map();$('comparison').textContent='';if(r.comparison){for(const x of r.comparison.rows){pageValues.set(key(x),x.page_display);checks.set(key(x),x.status)}$('comparison').textContent=`已有核对记录：${r.comparison.matched_rows}/${r.comparison.expected_rows} 条一致。`}$('status').className=r.metadata.complete?'ok':'error';$('status').textContent=(r.cache_hit?'已读取本地缓存，本次未发送在线请求。':'已完成一次批量请求。')+`\n收到 ${r.rows.length}/${r.metadata.expected_rows} 条日数据。`+(r.metadata.complete?'':' 存在缺失，请检查批次结果。');$('quality').replaceChildren();$('word').replaceChildren();for(const word of r.metadata.keywords){const q=r.metadata.quality_by_keyword[word];const chip=document.createElement('span');chip.className='chip';chip.textContent=`${word}：${q.complete?'7/7 天完整':'缺失 '+q.missing_search_dates.length+' 天'}`;$('quality').append(chip);const option=document.createElement('option');option.value=word;option.textContent=word;$('word').append(option)}$('provenance').textContent=`采集时间：${r.metadata.fetched_at} · 全国 · 抖音 · 搜索指数`;$('folder').textContent='本地结果：'+r.folder;$('results').style.display='block';renderRows()}catch(e){$('status').className='error';$('status').textContent='本地窗口连接异常，请检查工具状态。'}finally{$('fetch').disabled=false;$('compare').disabled=false}}
async function compare(){readVisible();$('compare').disabled=true;try{const entries=currentRows.map(r=>({keyword:r.keyword,date:r.date,page_display:pageValues.get(key(r))||''}));const r=await pywebview.api.compare(entries);if(!r.ok){$('comparison').textContent=r.message;return}checks=new Map(r.rows.map(x=>[key(x),x.status]));renderRows();$('comparison').textContent=r.verified?`${r.matched_rows}/${r.expected_rows} 条与页面精确一致。`:`${r.matched_rows}/${r.expected_rows} 条一致，核对尚未全部完成。`;$('status').textContent=r.verified?'已完成整批逐日核对。':'已保存当前核对记录。'}finally{$('compare').disabled=false}}
</script></html>
